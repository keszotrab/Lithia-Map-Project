<div
  class="viewport"
  (mousedown)="startDrag($event)"
  (wheel)="onWheel($event)"
>
  <div
    class="world"
    [style.transform]="worldTransform"
  >
    <img
      *ngFor="let tile of visibleTiles"
      class="tile"
      [src]="tile.src"
      [style.left.px]="tile.x"
      [style.top.px]="tile.y"
    />
  </div>
</div>
